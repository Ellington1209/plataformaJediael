version: '3.8'

services:
  # Serviço do PHP com Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-apache
    ports:
      - "8080:80" # Mapeia a porta 80 do contêiner para a porta 8080 da máquina local
    volumes:
      - .:/var/www/html # Mapeia o diretório atual para o diretório do Apache no contêiner
    networks:
      - app-network
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Serviço do MySQL
  db:
    image: mysql:5.7
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # Senha do root do banco de dados
      MYSQL_DATABASE: plataforma # Nome do banco de dados
      MYSQL_USER: user # Usuário do MySQL
      MYSQL_PASSWORD: userpassword # Senha do usuário
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql # Persistência de dados
    networks:
      - app-network

  # Serviço do phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # Nome do serviço MySQL no Docker
      PMA_USER: root
      PMA_PASSWORD: rootpassword # Senha do root do MySQL
      PMA_ARBITRARY: 1
    ports:
      - "8081:80" # Mapeia a porta 8081 para acessar o phpMyAdmin"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
